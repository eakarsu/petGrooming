services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: petgroom
      POSTGRES_USER: petgroom_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - petgroom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petgroom_app -d petgroom"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://petgroom_app:${POSTGRES_PASSWORD}@database:5432/petgroom
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL is required}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
  worker:
    build: .
    command: ["npm", "run", "worker"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://petgroom_app:${POSTGRES_PASSWORD}@database:5432/petgroom
      MAPS_API_TOKEN: ${MAPS_API_TOKEN:?MAPS_API_TOKEN is required}
      CALENDAR_API_TOKEN: ${CALENDAR_API_TOKEN:?CALENDAR_API_TOKEN is required}
      MESSAGING_API_TOKEN: ${MESSAGING_API_TOKEN:?MESSAGING_API_TOKEN is required}
      PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:?PAYMENT_API_TOKEN is required}
      TAX_API_TOKEN: ${TAX_API_TOKEN:?TAX_API_TOKEN is required}
      ACCOUNTING_API_TOKEN: ${ACCOUNTING_API_TOKEN:?ACCOUNTING_API_TOKEN is required}
    restart: unless-stopped
volumes:
  petgroom-data:
